name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  # Daily rebuild of main so future-dated articles appear on their date, and
  # build-time dates (homepage upcoming events, Register links, hero slide
  # expiry) stay current between releases. Runs ~5–6 am Atlantic.
  schedule:
    - cron: "0 9 * * *"
  # "Run workflow" button in the Actions tab — rebuild now without a release.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fenb-1 

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'  # pinned — managed by scripts/check-hugo-version.sh
          extended: true

      - name: Build
        run: hugo --minify --environment production

      - name: Build search index
        run: npx pagefind --site public --root-selector "main"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fenb-1/public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4