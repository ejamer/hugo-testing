name: PR Check

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fenb-1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'  # pinned — managed by scripts/check-hugo-version.sh
          extended: true

      - name: Build
        run: hugo --minify

      - name: Build search index
        run: npx pagefind --site public --root-selector "main"
