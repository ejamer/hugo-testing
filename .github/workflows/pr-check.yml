name: PR Check

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fenb-1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1 — pinned to a commit (third-party action)
        with:
          hugo-version: '0.169.0'  # pinned — managed by scripts/check-hugo-version.sh
          extended: true

      - name: Build
        run: hugo --minify

      - name: Build search index
        run: npx --yes pagefind@1.6.0 --site public --root-selector "main"  # pinned — managed by scripts/check-pagefind-version.sh
