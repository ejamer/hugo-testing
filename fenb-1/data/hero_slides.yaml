    alt_en: "Fencers celebrate with the Canadian flag — follow NB fencers at Canada Cup #1"
    alt_fr: "Escrimeurs célèbrent avec le drapeau canadien — suivez les escrimeurs du N.-B. à la Coupe Canada #1"
    link_en: "news/2026/sep-26-2026-09-25-canada-cup-1/"
