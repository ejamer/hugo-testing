# Homepage hero carousel — used by layouts/index.html
# Images live in static/images/hero/.
# Required: alt_en — alt text for accessibility, describing what the image shows.
#   - alt_fr: French alt text; falls back to alt_en if omitted or empty.
# Optional: add link_en / link_fr to make a slide clickable with a "Read more" badge.
#   - Internal paths: no leading slash, e.g. "news/2026/jun-16-results/"
#   - External URLs: full URL, e.g. "https://example.com/page"
#   - link_fr falls back to link_en if omitted or empty.
# Optional: add src_fr to serve a different image when viewing French content.
#   - src_fr falls back to src_en if omitted or empty.
# Optional: publish_from / expires — "YYYY-MM-DD", checked against the visitor's own
# browser clock (not build time), so a time-boxed slide can go live and retire itself
# without a redeploy.
#   - publish_from: slide is hidden until this date; omit/empty = live immediately.
#   - expires: slide is hidden starting the day AFTER this date (it stays visible
#     through the date itself); omit/empty = never expires.
#   - If every slide is currently hidden, the carousel shows a default FENB logo slate
#     instead of going empty.
# A slide whose link is a site page (e.g. "news/2026/nov-03-slug/") is also left out of
# the build until that page is published — a future-dated article goes live at the first
# build after its date, and the slide appears with it. Slides with no link, an external
# link, or a link to a file (PDF) aren't checked.
slides:
  - src_en: images/hero/hero-cwg-training-camp-en.jpg
    src_fr: images/hero/hero-cwg-training-camp-fr.jpg
    alt_en: "Canada Winter Games Athlete Training Camp, Nov 21–22 in Dieppe"
    alt_fr: "Camp d'entraînement des athlètes en vue des Jeux d'hiver du Canada, 21 et 22 nov. à Dieppe"
    link_en: "news/2026/nov-03-cwg-training-camp-2026/"
    link_fr: ""
    publish_from: "2026-11-03"
    expires: "2026-11-20"
  - src_en: images/hero/hero-register-october-en.png
    src_fr: images/hero/hero-register-october-fr.png
    alt_en: "Fencer lunging beside an October calendar and a Register Now clipboard — October tournaments and events"
    alt_fr: "Escrimeur en fente près d'un calendrier d'octobre — tournois et événements d'octobre, inscrivez-vous"
    link_en: "news/2026/oct-01-october-competitions-registration/"
    link_fr: ""
    publish_from: ""
    expires: "2026-10-20"
  - src_en: images/hero/hero-canada-cup-1-en.jpg
